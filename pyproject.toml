[project]
name = "chess-clone"
version = "0.1.0"
description = "Personal chess style cloning pipeline (Maia-Individual + opening book) for nick_p12"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chess>=1.11",
    "huggingface-hub>=1.12.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
